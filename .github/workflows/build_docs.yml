name: Build documentation

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

env:
  DEB_PYTHON_INSTALL_LAYOUT: deb_system
  DISPLAY: ":99.0"
  CI: 1

jobs:

  build:
    runs-on: ubuntu-22.04
    container: ghcr.io/fenics/dolfinx/lab:stable
    env:
      PUBLISH_DIR: ./build
      PYVISTA_OFF_SCREEN: false
      PYVISTA_JUPYTER_BACKEND: "html"
      LIBGL_ALWAYS_SOFTWARE: 1
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies for pyvista
        run: apt-get update && apt-get install -y --no-install-recommends libgl1 libosmesa6

      - name: Install build requirements
        run: |
          python3 -m pip install --group build

      - name: Install dependencies
        run: |
          python3 -m pip install scifem --no-build-isolation
          python3 -m pip install ".[docs]"

      - name: Build docs
        run: python3 -m sphinx -b html . build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_DIR }}
